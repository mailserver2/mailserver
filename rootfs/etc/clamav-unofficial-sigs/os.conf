################################################################################
# Rename to os.conf to enable this file
################################################################################

# Debian 9 and newer (tested up to Debian 13 trixie)

clam_user="clamav"
clam_group="clamav"

logrotate_group="adm"

clam_dbs="/var/lib/clamav"

clamd_pid="/run/clamav/clamd.pid"

# Through clamd's socket, which works for clamav, the user the update runs as,
# once clamd has finished starting
clamd_reload_opt="/usr/local/bin/clamav-unofficial-sigs-reload.sh"
# this is in case the needed/expected keyword is now restart and not reload
clamd_restart_opt="s6-svc -2 /services/clamd"

# this is enabled here https://github.com/mailserver2/mailserver/blob/master/rootfs/etc/clamav/unofficial-sigs/os.conf#L6
clamd_socket="/run/clamav/clamd.ctl"

# cron runs the update through this wrapper, which sends its output to syslog
cron_script_full_path="/usr/local/bin/clamav-unofficial-sigs-cron.sh"

# URLhaus now serves its ClamAV signatures only with an abuse.ch Auth-Key (the
# anonymous download answers 410 Gone), and the script has no setting for one.
# Re-enable once upstream supports an Auth-Key.
urlhaus_enabled="no"

