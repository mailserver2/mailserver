# Debian ships this file with "protocols { sieve = yes }" enabled, which would
# make DISABLE_SIEVE ineffective: conf.d is included after the protocols line
# in dovecot.conf, so it would switch ManageSieve back on. Ship our own copy
# with only the service definitions and let setup.sh add sieve to the
# protocols line when ManageSieve is enabled.

service managesieve-login {

  inet_listener sieve {
    port = 4190
  }

}

service managesieve {

}

protocol sieve {

}
