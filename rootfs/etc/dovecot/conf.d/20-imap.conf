imap_idle_notify_interval = 4 mins

protocol imap {

  # A protocol scoped mail_plugins block replaces the global one instead of
  # adding to it (2.3 wrote "mail_plugins = $mail_plugins imap_quota ..."),
  # so the global plugins have to be repeated here.
  mail_plugins {
    quota = yes
    mail_compress = yes
{{ if ne .DBDRIVER "ldap" }}
    quota_clone = yes
{{ end }}
    imap_quota = yes
    imap_sieve = yes
  }

  imap_client_workarounds {
    tb-extra-mailbox-sep = yes
  }

  mail_max_userip_connections = 20

}
