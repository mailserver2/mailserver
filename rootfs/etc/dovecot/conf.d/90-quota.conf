quota "User quota" {

{{ if eq .DBDRIVER "ldap" }}
  driver = maildir
{{ else }}
  driver = count
{{ end }}

  # 2.3 expressed this as a percentage (quota_grace = 10%%); 2.4 only accepts
  # an absolute size, so this is dovecot's own default rather than 10% of the
  # quota.
  quota_storage_grace = 10 M

  warning warn-90 {
    quota_storage_percentage = 90
    execute quota-warning {
      args = 90 %{user}
    }
  }

  warning warn-80 {
    quota_storage_percentage = 80
    execute quota-warning {
      args = 80 %{user}
    }
  }

  warning warn-70 {
    quota_storage_percentage = 70
    execute quota-warning {
      args = 70 %{user}
    }
  }

  warning warn-60 {
    quota_storage_percentage = 60
    execute quota-warning {
      args = 60 %{user}
    }
  }

}

# Default limit for users the userdb gives no quota for (2.3: quota_rule =
# *:storage=5GB). This has to sit outside the quota filter above: a limit set
# inside the filter outranks the per-user value coming from the userdb, which
# would pin every user to this default.
quota_storage_size = 5G

quota_exceeded_message = The quota of this mailbox is exhausted. Contact your system administrator.

# Was: quota_rule2 = Trash:storage=+100M
namespace inbox {
  mailbox Trash {
    quota_storage_extra = 100M
  }
}

{{ if ne .DBDRIVER "ldap" }}
# The 2.3 configuration used the dict quota driver so that usage was stored in
# the postfixadmin quota2 table. 2.4 removed that driver, so usage is now
# tracked by the count driver and mirrored into quota2 by quota_clone.
quota_clone {
  dict proxy {
    name = sqlquota
  }
}

dict_server {
  dict sqlquota {
    driver = sql
    sql_driver = {{ .DBDRIVER }}
{{ if eq .DBDRIVER "pgsql" }}
    pgsql {{ .DBHOST }} {
      pgsql_parameters {
        port = {{ .DBPORT }}
        dbname = {{ .DBNAME }}
        user = {{ .DBUSER }}
        password = {{ .DBPASS }}
      }
    }
{{ else }}
    mysql {{ .DBHOST }} {
      mysql_port = {{ .DBPORT }}
      mysql_dbname = {{ .DBNAME }}
      mysql_user = {{ .DBUSER }}
      mysql_password = {{ .DBPASS }}
    }
{{ end }}
    dict_map priv/quota/storage {
      sql_table = quota2
      username_field = username
      value_field bytes {
        type = uint
      }
    }

    dict_map priv/quota/messages {
      sql_table = quota2
      username_field = username
      value_field messages {
        type = uint
      }
    }
  }
}
{{ end }}

service dict {

  unix_listener dict {
    mode = 0600
    user = vmail
    group = vmail
  }

}

service quota-warning {

  executable = script /usr/local/bin/quota-warning.sh
  user = vmail

  unix_listener quota-warning {
    user = vmail
  }

}
