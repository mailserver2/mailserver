sieve_plugins {
  sieve_imapsieve = yes
  sieve_extprograms = yes
}

# Personal scripts (was: sieve = ... / sieve_dir = ...)
sieve_script personal {
  type = personal
  driver = file
  path = /var/mail/vhosts/%{user | domain}/%{user | username}/sieve
  active_path = /var/mail/vhosts/%{user | domain}/%{user | username}/.dovecot.sieve
}

# Used when the user has no script of their own (was: sieve_default)
sieve_script default {
  type = default
  driver = file
  path = /var/mail/sieve/default.sieve
}

# Run after the user's own script (was: sieve_after)
sieve_script after {
  type = after
  driver = file
  path = /var/mail/sieve/default.sieve
}

# Location of scripts included with :global (was: sieve_global)
sieve_script global {
  type = global
  driver = file
  path = /var/mail/sieve
}

sieve_max_script_size = 1M
sieve_quota_script_count = 0
sieve_quota_storage_size = 0
sieve_pipe_bin_dir = /etc/dovecot/sieve

sieve_global_extensions {
  vnd.dovecot.pipe = yes
}

# Pigeonhole Sieve Vacation Extension fix
# --------------------------------------------------------------
# More info :
# https://github.com/hardware/mailserver/issues/227
# http://wiki2.dovecot.org/Pigeonhole/Sieve/Extensions/Vacation
# https://tools.ietf.org/html/rfc5230#section-4.5

# Set the enveloppe address to allow rspamd to guess which
# domain key the message should be signed with
sieve_vacation_send_from_recipient = yes

# Send vacation replies even for aliases
# (was: sieve_vacation_dont_check_recipient = yes)
sieve_vacation_check_recipient = no
# --------------------------------------------------------------

# From elsewhere to Spam folder
namespace inbox {
  mailbox Spam {
    sieve_script report-spam {
      type = before
      cause = copy
      path = /etc/dovecot/sieve/report-spam.sieve
    }
  }
}

# From Spam folder to elsewhere
imapsieve_from Spam {
  sieve_script report-ham {
    type = before
    cause = copy
    path = /etc/dovecot/sieve/report-ham.sieve
  }
}
